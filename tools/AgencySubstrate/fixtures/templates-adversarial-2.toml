# Adversarial templates, round 2 (frozen after the criteria revision of 2026-10-09, so that the revised
# criteria are tested on templates they were not revised on). Built to fool the criteria. Labels come from the concept, not
# from a measurement, and are frozen (logs/gates/AGENCY-001/freeze-adversarial-2.txt) before evaluation.
# Same [params] as templates.toml (copied so that this file stands alone).
schema_version = 1

[params]
smax = 4
decay_period = 8
grow_cost = 1
resource0 = 10
rmax = 30
horizon = 60
alive_window = 5
strength0 = 4
switch_at = 20
survival_schedules = [
  { name = "p1-high", first = [5, 0], second = [5, 0] },
  { name = "p2-high", first = [0, 5], second = [0, 5] },
  { name = "p1-then-p2", first = [5, 0], second = [0, 5] },
  { name = "p2-then-p1", first = [0, 5], second = [5, 0] },
]
choice_resource0 = 1000
choice_rmax = 100000
choice_window = [5, 15]
choice_schedules = [
  { name = "c1-better", first = [5, 4], second = [5, 4] },
  { name = "c2-better", first = [4, 5], second = [4, 5] },
]

# A self-sustaining loop and a separate stimulus-driven forager. The loop does not take part in acting:
# the value-sensitive action is not the system's own. Not an agent.
[[template]]
name = "decoupled-forager"
L2 = false
L3 = true
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 1, 1, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s1", "m1", 1], ["s2", "m2", 1]]
initial = ["c1", "c2"]
maintain = true

# An agent whose self-maintaining core oscillates (a and b alternate). Each motor needs its sensor and
# either core unit. An agent: self-maintenance need not be a constant pattern.
[[template]]
name = "oscillating-core-agent"
L2 = true
L3 = true
units = ["s1", "s2", "m1", "m2", "a", "b"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["a", "b", 1], ["b", "a", 1], ["s1", "m1", 1], ["a", "m1", 1], ["b", "m1", 1], ["s2", "m2", 1], ["a", "m2", 1], ["b", "m2", 1]]
initial = ["a"]
maintain = true

# The agent with sensor input also reaching the core. Still an agent.
[[template]]
name = "sensor-in-core"
L2 = true
L3 = true
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s1", "m1", 1], ["c1", "m1", 1], ["s2", "m2", 1], ["c2", "m2", 1], ["s1", "c1", 1], ["s2", "c2", 1]]
initial = ["c1", "c2"]
maintain = true

# Wired the wrong way round: the sensor of the better patch drives the motor of the worse one. Its choice
# differs with value, but it harvests the worse patch and dies; tracking does not help it survive. Not an agent.
[[template]]
name = "crossed-wiring"
L2 = false
L3 = true
units = ["s1", "s2", "m1", "m2", "c1", "c2"]
theta = [1, 1, 2, 2, 1, 1]
patch_sensors = { s1 = 1, s2 = 2 }
motors = { m1 = 1, m2 = 2 }
resource_sensors = {}
edges = [["c1", "c2", 1], ["c2", "c1", 1], ["s2", "m1", 1], ["c1", "m1", 1], ["s1", "m2", 1], ["c2", "m2", 1]]
initial = ["c1", "c2"]
maintain = true
